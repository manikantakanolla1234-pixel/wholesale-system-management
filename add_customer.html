<!DOCTYPE html>
<html>
<head>

<title>Add Customer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2>Add Customer</h2>

<form method="POST">

<div class="mb-3">

<label>Name</label>

<input
type="text"
name="customer_name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Phone</label>

<input
type="text"
name="phone"
class="form-control"
required>

</div>

<div class="mb-3">

<label>City</label>

<input
type="text"
name="city"
class="form-control"
required>

</div>

<button class="btn btn-success">

Save Customer

</button>

<a href="/customers_page"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</body>

</html>
