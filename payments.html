<!DOCTYPE html>
<html>

<head>

<title>Payments</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

<div class="d-flex justify-content-between">

<h2>Payments</h2>

<div>

<a href="/add_payment"
class="btn btn-success">

Add Payment

</a>

<a href="/"
class="btn btn-secondary">

Home

</a>

</div>

</div>

<input
type="text"
id="searchPayment"
class="form-control mt-3 mb-3"
placeholder="Search Customer..."
onkeyup="searchPayment()">

<table
class="table table-bordered table-striped table-hover"
id="paymentTable">

<thead class="table-dark">

<tr>

<th>ID</th>

<th>Customer</th>

<th>Amount</th>

<th>Status</th>

<th>Date</th>

<th>Actions</th>

</tr>

</thead>

<tbody>

{% for payment in payments %}

<tr>

<td>{{payment.payment_id}}</td>

<td>{{payment.customer_name}}</td>

<td>{{payment.amount}}</td>

<td>{{payment.payment_status}}</td>

<td>{{payment.payment_date}}</td>

<td>

<a href="/edit_payment/{{payment.payment_id}}"
class="btn btn-warning btn-sm">

Edit

</a>

<a href="/delete_payment/{{payment.payment_id}}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete Payment?')">

Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

<script>

function searchPayment(){

let input=document.getElementById("searchPayment");

let filter=input.value.toUpperCase();

let table=document.getElementById("paymentTable");

let tr=table.getElementsByTagName("tr");

for(let i=1;i<tr.length;i++){

let td=tr[i].getElementsByTagName("td")[1];

if(td){

let txt=td.textContent||td.innerText;

tr[i].style.display=txt.toUpperCase().indexOf(filter)>-1?"":"none";

}

}

}

</script>

</body>

</html>
