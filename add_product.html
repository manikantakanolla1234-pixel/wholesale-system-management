<!DOCTYPE html>
<html>
<head>

<title>Add Product</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2>Add Product</h2>

<form method="POST">

<div class="mb-3">

<label>Product Name</label>

<input type="text"
name="product_name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Category</label>

<input type="text"
name="category"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Quantity</label>

<input type="number"
name="quantity"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Purchase Price</label>

<input type="number"
step="0.01"
name="purchase_price"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Selling Price</label>

<input type="number"
step="0.01"
name="selling_price"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Supplier</label>

<input type="text"
name="supplier"
class="form-control"
required>

</div>

<button class="btn btn-success">
Save Product
</button>

<a href="/products_page"
class="btn btn-secondary">
Cancel
</a>

</form>

</div>

</body>
</html>
