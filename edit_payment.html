<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Payment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">

<h3>Edit Payment</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label class="form-label">Customer</label>

<select
name="customer_id"
class="form-select"
required>

{% for customer in customers %}

<option
value="{{ customer.customer_id }}"
{% if customer.customer_id == payment.customer_id %}selected{% endif %}>

{{ customer.customer_name }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label class="form-label">Amount</label>

<input
type="number"
step="0.01"
name="amount"
class="form-control"
value="{{ payment.amount }}"
required>

</div>

<div class="mb-3">

<label class="form-label">Payment Status</label>

<select
name="payment_status"
class="form-select">

<option value="Paid"
{% if payment.payment_status=="Paid" %}selected{% endif %}>
Paid
</option>

<option value="Pending"
{% if payment.payment_status=="Pending" %}selected{% endif %}>
Pending
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">Payment Date</label>

<input
type="date"
name="payment_date"
class="form-control"
value="{{ payment.payment_date }}"
required>

</div>

<button class="btn btn-primary">

Update Payment

</button>

<a href="/payments_page" class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</body>

</html>
