<!DOCTYPE html>
<html>
<head>

<title>Edit Customer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2>Edit Customer</h2>

<form method="POST">

<div class="mb-3">

<label>Name</label>

<input
type="text"
name="customer_name"
class="form-control"
value="{{ customer.customer_name }}"
required>

</div>

<div class="mb-3">

<label>Phone</label>

<input
type="text"
name="phone"
class="form-control"
value="{{ customer.phone }}"
required>

</div>

<div class="mb-3">

<label>City</label>

<input
type="text"
name="city"
class="form-control"
value="{{ customer.city }}"
required>

</div>

<button class="btn btn-primary">

Update Customer

</button>

<a href="/customers_page"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</body>

</html>
