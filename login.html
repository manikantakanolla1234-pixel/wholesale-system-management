<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Wholesale Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 400px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .login-header {
            background: #0d6efd;
            color: white;
            border-radius: 15px 15px 0 0;
            padding: 25px;
            text-align: center;
        }

        .login-body {
            padding: 30px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            font-size: 17px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="card login-card">

    <div class="login-header">

        <h3>
            Wholesale Management System
        </h3>

        <p class="mb-0">
            Admin Login
        </p>

    </div>


    <div class="login-body">

        {% if error %}

        <div class="alert alert-danger">

            {{ error }}

        </div>

        {% endif %}


        <form method="POST"
              action="{{ url_for('login') }}">


            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required>

            </div>


            <button
                type="submit"
                class="btn btn-primary login-btn">

                Login

            </button>

        </form>

    </div>

</div>

</body>

</html>
